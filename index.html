<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quotes App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1>Random Quote Generator</h1>
      <div id="quote" class="quote">
        <p id="quote-text" class="quote-text">
          Click the button to see a quote
        </p>
        <p id="quote-author" class="quote-author"></p>
        <button id="new-quote" class="btn btn-primary">Show Quote</button>
        <i
          id="quote-favorite-btn"
          class="far fa-star star-icon"
          aria-hidden="true"
        ></i>
      </div>
    </div>
    <div class="favorites-container" id="favorites-container">
      <!-- Favorite quotes will be dinamically added here -->
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
